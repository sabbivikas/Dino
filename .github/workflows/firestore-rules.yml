name: Firestore rules

on:
  pull_request:
    paths:
      - "firestore.rules"
      - "firebase.json"
      - "firebase-rules-tests/**"
      - ".github/workflows/firestore-rules.yml"
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "firebase.json"
      - "firebase-rules-tests/**"

jobs:
  rules-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinning 17 here is only safe while firebase-rules-tests/package.json keeps
      # firebase-tools below v14 (currently ^13.35.1, so the caret cannot reach v14).
      # firebase-tools 15 requires JDK 21+ and fails outright on 17 — see suites.yml,
      # where that exact pairing broke the first CI run. If this project's
      # firebase-tools is ever bumped past v13, this java-version must go to 21 too.
      - name: Set up Java (Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: firebase-rules-tests/package-lock.json

      - name: Install test dependencies
        working-directory: firebase-rules-tests
        run: npm ci

      - name: Run Firestore rules tests
        working-directory: firebase-rules-tests
        run: npm test
