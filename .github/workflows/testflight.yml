name: TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Gate: the upload cannot start unless every suite passed in this same run.
  suites:
    uses: ./.github/workflows/suites.yml

  deploy:
    needs: [suites]
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # PROBE ONLY - reports the runner's Xcode inventory so a version can be
      # pinned in a follow-up. Does not assert or select anything.
      - name: Probe available Xcode versions
        run: |
          # shellcheck disable=SC2010 # listing Xcode app bundles by name is the point here
          ls -1 /Applications | grep -i '^Xcode'
          xcodebuild -version

      - name: Select Xcode
        run: |
          # Use latest available Xcode; update this if you need a specific version
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Write App Store Connect API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Dino.xcodeproj \
            -scheme Dino \
            -clonedSourcePackagesDirPath SourcePackages
        working-directory: .

      - name: Build and upload to TestFlight
        env:
          ASC_KEY_ID:      ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID:   ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"
        run: bundle exec fastlane beta
